paper: arXiv:2611.20888 Driving the Style
paper_pipeline:
- human mocap (authors; not public)
- GMR retarget to robot
- per-frame joint + body references; pelvis anchor
paper_protocol:
  train_generalization: random_walk only
  held_out_eval:
  - backward
  - side
  - slow
  in_distribution_motions:
  - random_walk
  - backward
  - side
  - slow
  - jog
  eval: drive with held-out clip velocity profiles; measure vs reference joints
wbot_disclaimer: Original Agile Robots mocap is not released. Clips below follow the
  same semantic roles using existing WBOT AMP locomotion data. backward/slow are documented
  approximations.
motions:
- role: random_walk
  file: src/assets/motions/wbot_20dof/vel_style/random_walk_tracking.npz
  source_amp: src/assets/amp_motions/wbot_20dof/walk_run_amp/walk.npz
  kind: direct
  notes: Paper main train clip. WBOT walk.npz covers multi-direction planar vel.
